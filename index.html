<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDC Site Orientation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
        .section-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: #4a5568;
            color: white;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            transition: background-color 0.3s ease;
        }
        .section-header:hover {
            background-color: #2d3748;
        }
        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-out;
            background-color: #ffffff;
            border-radius: 0.5rem;
            padding: 0 1.5rem;
            margin-bottom: 1rem;
        }
        .section-content.active {
            max-height: 1500px;
            padding: 1.5rem;
        }
        .arrow {
            transition: transform 0.3s ease;
        }
        .arrow.rotate {
            transform: rotate(90deg);
        }
        .message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2100;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-width: 300px;
            max-width: 90%;
            transition: top 0.5s ease-out;
        }
        .message-box.hidden {
            top: -100px;
        }
        .message-box.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message-box.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .quiz-modal {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .quiz-option {
            display: block;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 0.25rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }
        .quiz-option:hover {
            background-color: #f0f2f5;
        }
        .quiz-option input {
            margin-right: 1rem;
        }
        .text-wdc-accent {
            color: #6f9414;
        }
        .btn-wdc-blue {
            background-color: #003D52;
        }
        .btn-wdc-blue:hover {
            background-color: #00293a;
        }
        .btn-wdc-green {
            background-color: #96C61C;
        }
        .btn-wdc-green:hover {
            background-color: #7da414;
        }
        .download-btn {
            background-color: #96C61C;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #7da414;
        }
    </style>
</head>

        <section class="mb-8">

                    <li id="hazard-first-aid"></li>

                    <li id="hazard-heights"></li>
                    <li id="hazard-whmis"></li>
                    <li id="hazard-extinguishers"></li>
                </ul>

        </section>

        <section>

            </button>
        </footer>
    </div>

    <div id="quiz-modal" class="modal-overlay hidden">
        <div class="quiz-modal">

            </div>
            <div id="quiz-results" class="hidden text-center">

                <p id="results-text" class="text-xl mb-6"></p>

                    <div class="flex flex-col gap-3 items-center">

                        <button id="age-yes-btn" class="btn-wdc-blue text-white font-bold py-3 px-6 rounded w-full md:w-auto"></button>

                </div>

            </div>
        </div>
    </div>

                        { question: "आप एयर हॉर्न सुनते हैं: 3 छोटी आवाज़ें। इसका क्या मतलब है?", options: ["साइट खाली करना (evacuation)।", "ब्लास्टिंग की चेतावनी।", "प्राथमिक चिकित्सा आपातकाल।"], correctAnswer: 2 },

                        { question: "किसी क्षेत्र के चारों ओर सावधानी टेप है लेकिन वहाँ कोई काम नहीं कर रहा। आप क्या करेंगे?", options: ["अगर जल्दी है तो सावधानी से निकल सकते हैं।", "अंदर नहीं जाएँगे: टेप एक नियंत्रण क्षेत्र दर्शाता है, भले ही वहाँ कोई न हो।", "अगर काम पूरा दिखे तो टेप हटा देंगे।"], correctAnswer: 1 },
                        { question: "एक near miss होता है — कोई चोट या नुकसान नहीं। क्या इसकी रिपोर्ट होती है?", options: ["केवल अगर उपकरण को नुकसान हुआ हो।", "हाँ, हर घटना की तुरंत रिपोर्ट की जाती है, चाहे कितनी भी छोटी हो।", "इसका ज़िक्र केवल अगली सुरक्षा बैठक में होता है।"], correctAnswer: 1 }
                    ],
                    nextButton: "अगला",
                    submitButton: "क्विज़ जमा करें",
                    resultsTitle: "क्विज़ के परिणाम",
                    resultsText: (score, total) => `आपने ${total} में से ${score} अंक प्राप्त किए।`,
                    passedTitle: "बधाई हो, आप पास हो गए!",
                    passedMessage: "अपना ओरिएंटेशन पूरा करने के लिए, कृपया अपना विवरण दर्ज करें।",
                    failedTitle: "समीक्षा की आवश्यकता है",
                    feedbackWrong: "गलत — सही उत्तर हरे रंग में दिखाया गया है।",
                    ageQuestion: "आपकी उम्र क्या है?",
                    ageYes: "मेरी उम्र 25 वर्ष या कम है — Young Worker Orientation",
                    ageNo: "मेरी उम्र 26 वर्ष या अधिक है — पंजीकरण फ़ॉर्म पर जाएँ",
                    goToYoungBtn: "Young Worker Orientation पर जाएँ",
                    passedYoungMessage: "पंजीकरण से पहले, आपको Young Worker Orientation भी पूरी करनी होगी।",
                    finishButton: "पंजीकरण फॉर्म पर जाएं",
                    retakeButton: "क्विज़ फिर से दें"
                },
                messages: {
                    reviewPrevious: "कृपया पहले पिछला अनुभाग देखें।",
                    selectAnswer: "कृपया एक उत्तर चुनें।",
                    reviewAll: "क्विज़ शुरू करने से पहले कृपया सभी अनुभागों की समीक्षा करें।",
                    orientationComplete: "ओरिएंटेशन पूरा हुआ। साइट पर आपका स्वागत है!"
                }
            }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang] || translations.en;
            document.getElementById('main-title').textContent = t.mainTitle;
            document.getElementById('welcome-message').textContent = t.welcomeMessage;
            document.getElementById('rights-header').textContent = t.rightsHeader;
            document.getElementById('rights-subheader').textContent = t.rightsSubheader;
            document.getElementById('right-to-know').innerHTML = t.rightToKnow;
            document.getElementById('right-to-participate').innerHTML = t.rightToParticipate;
            document.getElementById('right-to-refuse').innerHTML = t.rightToRefuse;
            document.getElementById('obligations-subheader').textContent = t.obligationsSubheader;
            document.getElementById('obligation-work-safely').innerHTML = t.obligationWorkSafely;
            document.getElementById('obligation-use-ppe').innerHTML = t.obligationUsePpe;
            document.getElementById('obligation-report-hazards').innerHTML = t.obligationReportHazards;
            document.getElementById('obligation-no-disable').innerHTML = t.obligationNoDisable;
            document.getElementById('obligation-cooperate').innerHTML = t.obligationCooperate;
            document.getElementById('obligation-training').innerHTML = t.obligationTraining;
            document.getElementById('obligation-harassment').innerHTML = t.obligationHarassment;
            document.getElementById('emergency-contacts-header').textContent = t.emergencyContactsHeader;
            
            const csoEl = document.getElementById('contact-cso');
            csoEl.innerHTML = `<span>${t.contactCso}</span> <a href="#" onclick="downloadVCard('Bethzy Hernandez', 'CSO and First Aid', '6049060247'); return false;" class="download-btn">${t.downloadContact}</a>`;
            const alt1El = document.getElementById('contact-first-aid-alt1');
            alt1El.innerHTML = `<span>${t.contactFirstAidAlt1}</span> <a href="#" onclick="downloadVCard('Dan McGuire', 'Carpenter and First Aid', '6049384354'); return false;" class="download-btn">${t.downloadContact}</a>`;
            const alt2El = document.getElementById('contact-first-aid-alt2');
            alt2El.innerHTML = `<span>${t.contactFirstAidAlt2}</span> <a href="#" onclick="downloadVCard('Shaun Swansborough', 'Superintendent and First Aid', '6048499816'); return false;" class="download-btn">${t.downloadContact}</a>`;

            document.getElementById('hazards-header').textContent = t.hazardsHeader;
            document.getElementById('hazard-mobile-equipment').innerHTML = t.hazardMobileEquipment;
            document.getElementById('hazard-blasting').innerHTML = t.hazardBlasting;
            document.getElementById('hazard-alarm').innerHTML = t.hazardAlarm;
            document.getElementById('hazard-first-aid').innerHTML = t.hazardFirstAid;
            document.getElementById('hazard-muster-point').innerHTML = t.hazardMusterPoint;
            document.getElementById('hazard-wildlife').innerHTML = t.hazardWildlife;
            document.getElementById('hazard-heights').innerHTML = t.hazardHeights;
            document.getElementById('hazard-whmis').innerHTML = t.hazardWhmis;
            document.getElementById('hazard-extinguishers').innerHTML = t.hazardExtinguishers;
            document.getElementById('rules-header').textContent = t.rulesHeader;
            const rulesListEl = document.getElementById('rules-list');
            rulesListEl.innerHTML = '';
            (t.rulesList || translations.en.rulesList).forEach(rule => {
                const li = document.createElement('li');
                li.innerHTML = rule;
                rulesListEl.appendChild(li);
            });
            document.getElementById('startQuizButton').textContent = t.startQuizButton;
        }

        const sectionOrder = ['rights-content', 'emergency-contacts-content', 'hazards-content', 'rules-content'];

        function showMessage(msgKey, type) {
            const t = translations[currentLang] || translations.en;
            const msg = t.messages[msgKey];
            const messageBox = document.getElementById('message');
            messageBox.textContent = msg;
            messageBox.className = 'message-box';
            messageBox.classList.add(type);
            messageBox.classList.remove('hidden');
            setTimeout(() => {
                messageBox.classList.add('hidden');
                messageBox.classList.remove(type);
            }, 3000);
        }

        window.downloadVCard = function(fullName, title, phone) {
            const nameParts = fullName.split(' ');
            const firstName = nameParts[0];
            const lastName = nameParts.slice(1).join(' ');

            const vCard = `BEGIN:VCARD
VERSION:3.0
N:${lastName};${firstName};;;
FN:${fullName}
TITLE:${title}
ORG:WDC
TEL;TYPE=CELL:${phone}
END:VCARD`;
            const blob = new Blob([vCard], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${fullName.replace(' ', '_')}.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const quizModal = document.getElementById('quiz-modal');
            const nextQuestionBtn = document.getElementById('next-question-btn');
            const startQuizButton = document.getElementById('startQuizButton');
            const languageSelector = document.getElementById('language-selector');

            changeLanguage('en');

            languageSelector.addEventListener('change', (event) => {
                changeLanguage(event.target.value);
            });

            window.toggleSection = function(id) {
                const content = document.getElementById(id);
                const header = content.previousElementSibling;
                const arrow = header.querySelector('.arrow');
                const currentIndex = sectionOrder.indexOf(id);

                if (currentIndex > 0) {
                    const prevId = sectionOrder[currentIndex - 1];
                    if (document.getElementById(prevId).dataset.viewed !== 'true') {
                        showMessage('reviewPrevious', 'error');
                        return;
                    }
                }
                
                if (content.classList.contains('active')) {
                    content.classList.remove('active');
                    arrow.classList.remove('rotate');
                } else {
                    document.querySelectorAll('.section-content.active').forEach(openContent => {
                        openContent.classList.remove('active');
                        openContent.previousElementSibling.querySelector('.arrow').classList.remove('rotate');
                    });
                    content.classList.add('active');
                    arrow.classList.add('rotate');
                    content.dataset.viewed = 'true';
                    
                    if (id === 'rules-content') {
                        document.getElementById('footer').classList.remove('hidden');
                    }
                }
            };

            let currentQuizQuestions = [];
            let currentQuestionIndex = 0;
            let score = 0;
            const passingScore = 4;
            
            function startQuiz() {
                const t = translations[currentLang] || translations.en;
                currentQuestionIndex = 0;
                score = 0;
                currentQuizQuestions = t.quiz.questionBank.sort(() => 0.5 - Math.random()).slice(0, 5);
                const quizContent = document.getElementById('quiz-content');
                const quizResults = document.getElementById('quiz-results');
                quizContent.classList.remove('hidden');
                quizResults.classList.add('hidden');
                quizModal.classList.remove('hidden');
                displayQuestion();
            }

            function displayQuestion() {
                const t = translations[currentLang] || translations.en;
                const question = currentQuizQuestions[currentQuestionIndex];
                const questionText = document.getElementById('question-text');
                const optionsContainer = document.getElementById('options-container');
                questionText.textContent = question.question;
                optionsContainer.innerHTML = '';
                question.options.forEach((option, index) => {
                    const optionId = `option${index}`;
                    optionsContainer.innerHTML += `
                        <label for="${optionId}" class="quiz-option">
                            <input type="radio" name="quiz-option" id="${optionId}" value="${index}">
                            ${option}
                        </label>
                    `;
                });
                nextQuestionBtn.textContent = (currentQuestionIndex === currentQuizQuestions.length - 1) ? t.quiz.submitButton : t.quiz.nextButton;
            }

            let awaitingContinue = false;

            function advanceQuestion() {
                currentQuestionIndex++;
                if (currentQuestionIndex < currentQuizQuestions.length) {
                    displayQuestion();
                } else {
                    showQuizResults();
                }
            }

            function handleNextQuestion() {
                const t = translations[currentLang] || translations.en;
                if (awaitingContinue) {
                    awaitingContinue = false;
                    advanceQuestion();
                    return;
                }
                const selectedOption = document.querySelector('input[name="quiz-option"]:checked');
                if (!selectedOption) {
                    showMessage('selectAnswer', 'error');
                    return;
                }
                const question = currentQuizQuestions[currentQuestionIndex];
                if (parseInt(selectedOption.value) === question.correctAnswer) {
                    score++;
                    advanceQuestion();
                } else {
                    // Show which answer was correct before moving on
                    document.querySelectorAll('#options-container .quiz-option').forEach((label, idx) => {
                        label.querySelector('input').disabled = true;
                        if (idx === question.correctAnswer) {
                            label.classList.add('bg-green-100', 'border-green-500', 'font-semibold');
                        }
                        if (idx === parseInt(selectedOption.value)) {
                            label.classList.add('bg-red-100', 'border-red-500');
                        }
                    });
                    const fb = document.createElement('p');
                    fb.className = 'text-red-600 font-semibold mt-3';
                    fb.textContent = t.quiz.feedbackWrong || translations.en.quiz.feedbackWrong;
                    document.getElementById('options-container').appendChild(fb);
                    awaitingContinue = true;
                    nextQuestionBtn.textContent = (currentQuestionIndex === currentQuizQuestions.length - 1) ? t.quiz.submitButton : t.quiz.nextButton;
                }
            }

            function showQuizResults() {
                const t = translations[currentLang] || translations.en;
                const quizContent = document.getElementById('quiz-content');
                const quizResults = document.getElementById('quiz-results');
                const resultsTitle = document.getElementById('results-title');
                const resultsText = document.getElementById('results-text');
                const quizActionBtn = document.getElementById('quiz-action-btn');

                quizContent.classList.add('hidden');
                quizResults.classList.remove('hidden');
                
                const passed = score >= passingScore;
                
                const ageQuestion = document.getElementById('age-question');

                if (passed) {
                    resultsTitle.textContent = t.quiz.passedTitle;
                    resultsText.textContent = t.quiz.passedMessage;
                    // Ask if the worker is 25 or younger / new to construction before showing the action button
                    document.getElementById('age-question-text').textContent = t.quiz.ageQuestion || translations.en.quiz.ageQuestion;
                    document.getElementById('age-yes-btn').textContent = t.quiz.ageYes || translations.en.quiz.ageYes;
                    document.getElementById('age-no-btn').textContent = t.quiz.ageNo || translations.en.quiz.ageNo;
                    ageQuestion.classList.remove('hidden');
                    quizActionBtn.classList.add('hidden');
                    quizActionBtn.classList.remove('btn-wdc-blue');
                    quizActionBtn.classList.add('btn-wdc-green');
                } else {
                    ageQuestion.classList.add('hidden');
                    quizActionBtn.classList.remove('hidden');
                    resultsTitle.textContent = t.quiz.failedTitle;
                    resultsText.textContent = t.quiz.resultsText(score, currentQuizQuestions.length);
                    quizActionBtn.textContent = t.quiz.retakeButton;
                    quizActionBtn.href = "#";
                    quizActionBtn.onclick = (e) => {
                        e.preventDefault();
                        startQuiz();
                    };
                    quizActionBtn.classList.remove('btn-wdc-green');
                    quizActionBtn.classList.add('btn-wdc-blue');
                }
            }

            nextQuestionBtn.addEventListener('click', handleNextQuestion);

            document.getElementById('age-yes-btn').addEventListener('click', () => {
                const t = translations[currentLang] || translations.en;
                const quizActionBtn = document.getElementById('quiz-action-btn');
                document.getElementById('age-question').classList.add('hidden');
                document.getElementById('results-text').textContent = t.quiz.passedYoungMessage || translations.en.quiz.passedYoungMessage;
                quizActionBtn.textContent = t.quiz.goToYoungBtn || translations.en.quiz.goToYoungBtn;
                quizActionBtn.href = "young-worker.html";
                quizActionBtn.onclick = null;
                quizActionBtn.classList.remove('hidden');
            });

            document.getElementById('age-no-btn').addEventListener('click', () => {
                const t = translations[currentLang] || translations.en;
                const quizActionBtn = document.getElementById('quiz-action-btn');
                document.getElementById('age-question').classList.add('hidden');
                quizActionBtn.textContent = t.quiz.finishButton;
                quizActionBtn.href = "https://forms.gle/i9MmVPU1uPnTtpmY6";
                quizActionBtn.onclick = null;
                quizActionBtn.classList.remove('hidden');
            });
            
            startQuizButton.addEventListener('click', () => {
               if (!sectionOrder.every(id => document.getElementById(id).dataset.viewed === 'true')) {
                    showMessage('reviewAll', 'error');
                    return;
                }
                startQuiz();
            });
        });
    </script>
